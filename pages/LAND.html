<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAND</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            font-family: Arial, sans-serif;
            color: white;
        }

        /* Pop-up hamburger menu styles */
        .sidenav {
            height: 100%;
            width: 250px;
            position: fixed;
            z-index: 1001;
            top: 0;
            left: -250px; /* Hidden by default */
            background-color: rgba(0, 0, 0, 0.95);
            overflow-x: hidden;
            padding-top: 60px;
            transition: 0.3s;
            backdrop-filter: blur(10px);
        }

        .sidenav.active {
            left: 0; /* Show when active */
        }

        /* Overlay for pop-up menu */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
        }

        .menu-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Hamburger menu for sidenav */
        .sidenav .hamburger-menu {
            display: none; /* Hide the one inside sidenav */
            flex-direction: column;
            gap: 4px;
            padding: 8px 8px 8px 32px;
            cursor: pointer;
        }

        .sidenav .hamburger-menu span {
            width: 30px;
            height: 4px;
            background-color: rgb(252, 0, 0);
            display: block;
            transition: 0.3s;
        }

        /* Hamburger menu styles */
        .hamburger {
            display: block;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            cursor: pointer;
            padding: 10px;
            background: none;
            border: none;
        }

        .hamburger span {
            display: block;
            width: 25px;
            height: 3px;
            margin: 5px 0;
            background: rgb(252, 0, 0);
            transition: 0.3s;
        }

        /* Close button for pop-up menu */
        .close-menu {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: rgb(252, 0, 0);
            font-size: 30px;
            cursor: pointer;
            padding: 5px;
        }

        .sidenav .sub-item {
            padding: 12px 8px 12px 48px;
            text-decoration: none;
            font-size: 18px;
            color: #818181;
            display: block;
            transition: 0.3s;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidenav .sub-item:hover {
            color: rgb(252, 0, 0);
            background-color: rgba(252, 0, 0, 0.1);
        }

        .sidenav .sub-item.active {
            color: rgb(252, 0, 0);
            background-color: rgba(252, 0, 0, 0.1);
        }

        /* Content Styles */
        .content {
            margin-left: 0;
            padding: 50px;
            transition: 0.3s;
            text-align: center;
            max-width: 1200px;
            margin-right: auto;
        }

        .photo-grid {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: minmax(320px, 1fr);
            gap: 40px;
            justify-content: start;
            align-items: center;
            max-width: 100vw;
            margin: 40px auto;
            padding: 20px;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: thin;
        }

        .photo-item img {
            width: 100%;
            max-width: 480px;
            height: 420px;
            object-fit: cover;
            display: block;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.25);
        }

        /* Mobile styles */
        @media screen and (max-width: 768px) {
            .photo-grid {
                column-count: 2;
                margin: 20px;
            }
        }

        @media screen and (max-width: 480px) {
            .photo-grid {
                column-count: 1;
            }
        }

        /* Add to CSS */
        .photo-grid-wrapper {
            position: relative;
            width: 100vw;
            overflow-x: auto;
            margin: 0 auto 24px auto;
        }
        .land-progress-bar {
            width: 100vw;
            height: 6px;
            background: rgb(252, 0, 0);
            border-radius: 3px;
            margin: 0 auto 24px auto;
            overflow: hidden;
            position: relative;
        }
        .land-progress-bar-fill {
            height: 100%;
            background: rgb(252, 0, 0);
            width: 0%;
            transition: width 0.2s;
        }

        @media (max-width: 768px) {
            h1 {
                text-align: center;
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Visible hamburger button -->
    <button class="hamburger">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- Menu overlay -->
    <div class="menu-overlay"></div>

    <!-- Pop-up hamburger menu -->
    <div class="sidenav" id="sidenav">
        <button class="close-menu">&times;</button>
        <a href="../index.html" class="sub-item">Home</a>
        <a href="/pages/peopleplacesthings.html" class="sub-item">PEOPLE, PLACES, THINGS</a>
        <a href="/pages/classicos.html" class="sub-item">CLASSICOS</a>
        <a href="/pages/lAND.html" class="sub-item active">LAND</a>
        <a href="/pages/concerts.html" class="sub-item">CONCERTS</a>
    </div>
    
    <div class="content">
        <h1>LAND</h1>
        <div class="photo-grid-wrapper">
            <div class="photo-grid">
                <div class="photo-item">
                    <img src="../Images/l1.png" alt="Film photo 1">
                </div>
                <div class="photo-item">
                    <img src="../Images/l2.png" alt="Film photo 2">
                </div>
                <div class="photo-item">
                    <img src="../Images/l3.png" alt="Film photo 3">
                </div>
                <div class="photo-item">
                    <img src="../Images/l4.png" alt="Film photo 4">
                </div>
                <div class="photo-item">
                    <img src="../Images/l5.png" alt="Film photo 5">
                </div>
                <div class="photo-item">
                    <img src="../Images/l6.png" alt="Film photo 6">
                </div>
                <div class="photo-item">
                    <img src="../Images/l7.png" alt="Film photo 7">
                </div>
                <div class="photo-item">
                    <img src="../Images/l8.png" alt="Film photo 8">
                </div>
            </div>
            <div class="land-progress-bar">
                <div class="land-progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <script>
    // Wait for the page to load completely
    document.addEventListener('DOMContentLoaded', function() {
        console.log('Page loaded, setting up menu functionality');
        
        // Get the elements
        const hamburger = document.querySelector('.hamburger');
        const sidenav = document.getElementById('sidenav');
        const overlay = document.querySelector('.menu-overlay');
        
        console.log('Hamburger button:', hamburger);
        console.log('Sidenav:', sidenav);
        console.log('Overlay:', overlay);
        
        // Add click event to hamburger button
        if (hamburger) {
            hamburger.addEventListener('click', function() {
                console.log('Hamburger clicked!');
                toggleMenu();
            });
        }
        
        // Add click event to overlay
        if (overlay) {
            overlay.addEventListener('click', function() {
                console.log('Overlay clicked!');
                closeMenu();
            });
        }
        
        // Add click event to close button
        const closeBtn = document.querySelector('.close-menu');
        if (closeBtn) {
            closeBtn.addEventListener('click', function() {
                console.log('Close button clicked!');
                closeMenu();
            });
        }

        const wrapper = document.querySelector('.photo-grid-wrapper');
        const barFill = document.querySelector('.land-progress-bar-fill');
        if (wrapper && barFill) {
            wrapper.addEventListener('scroll', function() {
                const maxScroll = wrapper.scrollWidth - wrapper.clientWidth;
                const percent = maxScroll > 0 ? (wrapper.scrollLeft / maxScroll) * 100 : 0;
                barFill.style.width = percent + '%';
            });
            // Set initial width
            const maxScroll = wrapper.scrollWidth - wrapper.clientWidth;
            const percent = maxScroll > 0 ? (wrapper.scrollLeft / maxScroll) * 100 : 0;
            barFill.style.width = percent + '%';
        }
    });
    
    function toggleMenu() {
        console.log('toggleMenu function called');
        const sidenav = document.getElementById('sidenav');
        const overlay = document.querySelector('.menu-overlay');
        
        if (sidenav && overlay) {
            console.log('Toggling menu...');
            sidenav.classList.toggle('active');
            overlay.classList.toggle('active');
            console.log('Menu toggled. Sidenav classes:', sidenav.className);
            console.log('Menu toggled. Overlay classes:', overlay.className);
        } else {
            console.log('ERROR: Menu elements not found!');
        }
    }

    function closeMenu() {
        console.log('closeMenu function called');
        const sidenav = document.getElementById('sidenav');
        const overlay = document.querySelector('.menu-overlay');
        
        if (sidenav && overlay) {
            sidenav.classList.remove('active');
            overlay.classList.remove('active');
            console.log('Menu closed');
        }
    }

    // Close menu on escape key
    document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
            closeMenu();
        }
    });
    </script>
</body>
</html>
