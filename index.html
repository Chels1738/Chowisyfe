	<style>
		html, body {
			margin: 0;
			padding: 0;
			overflow-x: hidden; /* Prevent horizontal scroll */
		}

		body::before {
			content: '';
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-image: none; /* Ensure no background image */
			background-size: cover;
			background-position: center;
			opacity: 0;
			z-index: -1;
		}

		body {
			background-image: none; /* Ensure no background image */
			background-repeat: no-repeat;
			background-position: center center;
			background-size: auto;
			background-attachment: fixed;
			font-family: Arial, sans-serif;
			background-color: rgb(0, 0, 0); /* Plain black background */
			color: rgb(0, 0, 0);
			position: relative;
		}
		
		.navbar {
			display: flex;
			flex-direction: row;
			justify-content: center; /* Center horizontally */
			align-items: center; /* Center vertically */
			padding: 40px 20px 10px 20px; /* Increase top padding to move logo lower */
			margin-left: 0;
			background-color: rgb(0, 0, 0);
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 220px;
			z-index: 1000;
		}
		
		.navbar a {
			color: rgb(252, 0, 0);
			text-decoration: none;
			margin-left: 20px;
			font-size: 24px;
		}
		
		.site-title {
			text-align: center;
			margin-top: 50px;
			margin-bottom: 100px;
		}
		
		.site-title a {
			color: rgb(252, 0, 0);
			text-decoration: none;
			font-size: 64px;
			text-transform: uppercase;
			font-weight: bold;
			text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.3);
		}
		
		.gallery {
			display: grid;
			grid-template-columns: repeat(4, 280px);
			grid-template-rows: repeat(3, auto);
			gap: 20px;
			justify-content: center;
			margin: 1400px auto 0 auto;
			padding: 20px;
			max-width: 1200px;
		}
		
		.gallery-item {
			width: 280px;
			height: 200px;
			background-color: white;
			position: relative;
			border: 8px solid white;
		}
		
		.gallery-item img {
			width: 100%;
			height: 100%;
			object-fit: cover;
			display: block;
		}

		.gallery-item a {
			position: relative;
			display: block;
			width: 100%;
			height: 100%;
		}

		.gallery-item a::before {
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(60,60,60,0.55); /* grey overlay */
			z-index: 1;
			pointer-events: none;
		}

		.gallery-item a::after {
			content: attr(data-title);
			position: absolute;
			left: 50%;
			top: 50%;
			transform: translate(-50%, -50%);
			background: rgb(252, 0, 0);
			color: #fff;
			padding: 6px 14px;
			font-size: 0.9rem;
			font-weight: bold;
			text-transform: uppercase;
			border-radius: 6px;
			box-shadow: 0 2px 8px rgba(0,0,0,0.15);
			z-index: 2;
			pointer-events: none;
			letter-spacing: 1px;
			text-align: center;
			opacity: 1;
		}

		/* Remove old hover effect */
		.gallery-item a:hover::after {
			opacity: 1;
		}
		.gallery-item a:hover::before {
			opacity: 1;
		}

		.hover-text {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-color: rgba(0, 0, 0, 0.7);
			display: flex;
			justify-content: center;
			align-items: center;
			color: white;
			font-size: 2em;
			text-decoration: none;
			opacity: 0;
			transition: opacity 0.3s ease;
		}

		.hover-text:hover {
			opacity: 1;
		}

		.navbar .instagram-link {
			display: flex;
			align-items: center;
		}

		.navbar .instagram-icon {
			width: 70px;
			height: 50px;
			transition: transform 0.3s ease;
		}

		.navbar .instagram-icon:hover {
			transform: scale(1.1);
		}

		/* Pop-up hamburger menu styles */
		.sidenav {
			height: 100%;
			width: 250px;
			position: fixed;
			z-index: 1001;
			top: 0;
			left: -250px; /* Hidden by default */
			background-color: rgba(0, 0, 0, 0.95);
			overflow-x: hidden;
			padding-top: 60px;
			transition: 0.3s;
			backdrop-filter: blur(10px);
		}

		.sidenav.active {
			left: 0; /* Show when active */
		}

		/* Overlay for pop-up menu */
		.menu-overlay {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-color: rgba(0, 0, 0, 0.5);
			z-index: 1000;
			opacity: 0;
			visibility: hidden;
			transition: 0.3s;
		}

		.menu-overlay.active {
			opacity: 1;
			visibility: visible;
		}

		/* Close button for pop-up menu */
		.close-menu {
			position: absolute;
			top: 20px;
			right: 20px;
			background: none;
			border: none;
			color: rgb(252, 0, 0);
			font-size: 30px;
			cursor: pointer;
			padding: 5px;
		}

		.sidenav .sub-item {
			padding: 12px 8px 12px 48px;
			text-decoration: none;
			font-size: 18px;
			color: #818181;
			display: block;
			transition: 0.3s;
			border-bottom: 1px solid rgba(255, 255, 255, 0.1);
		}

		.sidenav .sub-item:hover {
			color: rgb(252, 0, 0);
			background-color: rgba(252, 0, 0, 0.1);
		}

		.sidenav .sub-item.active {
			color: rgb(252, 0, 0);
			background-color: rgba(252, 0, 0, 0.1);
		}

		/* Hamburger menu styles */
		.hamburger {
			display: block;
			position: fixed;
			top: 20px;
			left: 20px;
			z-index: 1002;
			cursor: pointer;
			padding: 10px;
			background: none;
			border: none;
		}

		.hamburger span {
			display: block;
			width: 25px;
			height: 3px;
			margin: 5px 0;
			background: rgb(252, 0, 0);
			transition: 0.3s;
		}

		/* Mobile styles */
		@media screen and (max-width: 768px) {
			.hamburger {
				display: block; /* Show hamburger menu on mobile */
			}
			
			.desktop-insta-follow {
				display: none; /* Hide desktop Instagram follow on mobile */
			}
			
			.navbar {
				height: 120px; /* Increase navbar height to accommodate larger logo */
				padding: 20px 20px 10px 20px; /* Add more top padding to move logo down */
			}
			
			.navbar-logo {
				height: 280px !important; /* Bigger logo for mobile screens */
				max-height: 280%;
				width: auto;
			}
			
			body {
				background: #222 !important;
				background-image: none !important;
			}
			.gallery {
				grid-template-columns: repeat(2, 1fr);
				gap: 20px;
				margin: 0 auto;
				padding: 20px 10px 40px 10px;
				max-width: 100vw;
			}
			.gallery-item {
				width: 100%;
				height: 180px;
				border: none;
				background: #e0e0e0;
			}
			.gallery-item img {
				width: 100%;
				height: 100%;
				object-fit: cover;
				background: #e0e0e0;
			}
			.sidenav {
				width: 75vw;
				min-width: 220px;
				max-width: 350px;
				left: -75vw;
				padding-top: 40px;
				background: #111;
			}
			.sidenav.active {
				left: 0;
			}
			.sidenav .sub-item, .sidenav .main-item {
				font-size: 22px;
				color: #ccc;
				text-align: left;
				padding-left: 32px !important;
				padding-top: 18px;
				padding-bottom: 18px;
				border-bottom: 1px solid #222;
			}
			.sidenav .main-item {
				font-size: 26px;
				font-weight: bold;
				color: #aaa;
				letter-spacing: 1px;
				margin-bottom: 10px;
			}
			.sidenav .sub-item.active {
				color: rgb(252, 0, 0);
			}
			.close-menu {
				top: 18px;
				right: 18px;
				font-size: 32px;
			}
			.gallery {
				margin-top: 0;
			}
			.hide-on-mobile {
				display: none !important;
			}
			.instagram-link-topright {
				display: none !important;
			}
			.mobile-insta-follow {
				display: block;
				text-align: center;
				padding: 24px 10px 16px 10px;
				font-size: 18px;
				color: #fff;
				background: none;
				font-family: Arial, sans-serif;
				font-weight: bold;
				letter-spacing: 0.5px;
				width: auto;
				box-sizing: border-box; /* Ensure padding is included in the width */
			}
			.mobile-insta-follow a {
				color: rgb(252, 0, 0);
				text-decoration: underline;
			}
			.insta-username {
				color: rgb(252, 0, 0);
				text-decoration: underline;
			}
			.slideshow-container {
				display: none !important;
			}
			.prev, .next {
				display: none !important;
			}
		}

		@media screen and (max-width: 480px) {
			.gallery {
				grid-template-columns: 1fr;
			}
			
			.gallery-item {
				height: 200px;
			}
		}

		.navbar-logo {
			height: 450px; /* Adjusted logo size for desktop */
			width: auto;
			vertical-align: middle;
			opacity: 1;
		}

		.logo-container {
			display: flex;
			justify-content: center;
			align-items: center;
			position: static; /* Reset positioning to flow with flexbox */
			top: auto;
			left: auto;
			transform: none;
			z-index: auto;
			padding: 0;
			margin: 0;
		}

		.mobile-insta-follow {
			display: none; /* Hide by default on desktop */
		}

		.desktop-insta-follow {
			display: block;
			text-align: center;
			padding: 40px 20px;
			font-size: 20px;
			color: white;
			background: none;
			font-family: Arial, sans-serif;
			font-weight: bold;
			letter-spacing: 0.5px;
		}

		.desktop-insta-follow a {
			color: rgb(252, 0, 0);
			text-decoration: underline;
		}

		.desktop-insta-follow .insta-username {
			color: rgb(252, 0, 0);
			text-decoration: underline;
		}

		/* Mobile styles for dropdown */
		@media screen and (max-width: 768px) {
			.dropdown-gallery {
				grid-template-columns: repeat(2, 1fr);
				gap: 20px;
				padding: 20px 10px;
			}
			
			.dropdown-gallery .gallery-item {
				width: 100%;
				height: 180px;
				border: none;
				background: #e0e0e0;
			}
		}

		.main-header-content {
			display: flex;
			flex-direction: column;
			align-items: center;
			padding-top: 100px; /* Adjust this value to control vertical position */
			position: static; /* Revert to normal flow */
			left: auto;
			transform: none;
			z-index: auto;
		}

		.slideshow-container {
			width: 120vw; /* Wider than viewport width */
			height: calc(100vh - 220px); /* Full viewport height minus navbar height */
			overflow: hidden;
			position: relative; /* Changed from fixed to relative for scrollable flow */
			top: auto; /* Remove fixed top positioning */
			left: -10vw; /* Offset to center the wider slideshow */
			z-index: 1; /* Changed from -50 to 1 to ensure links are clickable */
			margin-top: 200px; /* Reduced margin to move slideshow higher */
			margin-left: 0; /* Remove margin since it's now full screen */
		}

		.slideshow-image {
			width: 100%;
			height: 100%;
			object-fit: cover;
			position: absolute;
			top: 0;
			left: 0;
			opacity: 0;
			transition: opacity 1s ease-in-out;
		}

		.slideshow-image::before {
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-color: rgba(0, 0, 0, 0.5); /* 50% opaque black overlay */
			z-index: 1;
		}

		.slideshow-image.active {
			opacity: 1;
		}

		/* Slideshow link styling */
		.slideshow-link {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			display: block;
			text-decoration: none;
			opacity: 0;
			transition: opacity 1s ease-in-out;
			pointer-events: none; /* Disable pointer events by default */
			z-index: 5; /* Ensure links are above other elements */
		}

		.slideshow-link.active {
			opacity: 1;
			pointer-events: auto; /* Enable pointer events only for active slide */
		}

		.slideshow-link.active:hover {
			cursor: pointer;
		}

		/* Black/Grey overlay always visible on active slide */
		.slideshow-link.active::before {
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0,0,0,0.55);
			z-index: 10;
			opacity: 1;
			pointer-events: none;
		}

		/* Red rectangle title overlay always visible on active slide */
		.slideshow-link.active::after {
			content: attr(data-title);
			position: absolute;
			left: 50%;
			bottom: 60px;
			transform: translateX(-50%);
			background: rgb(252, 0, 0);
			color: #fff;
			padding: 16px 40px;
			font-size: 2rem;
			font-weight: bold;
			text-transform: uppercase;
			border-radius: 8px;
			box-shadow: 0 4px 16px rgba(0,0,0,0.15);
			z-index: 20;
			cursor: pointer;
			pointer-events: none;
			opacity: 1;
			letter-spacing: 1px;
			text-align: center;
		}

		/* Remove hover effect for overlay and title */
		.slideshow-link.active:hover::before,
		.slideshow-link.active:hover::after {
			opacity: 1;
		}

		/* Carousel navigation styles */
		.prev, .next {
			cursor: pointer;
			position: absolute;
			top: 50%; /* Changed from 20% to 50% to move arrows lower */
			width: auto;
			padding: 16px;
			margin-top: -22px;
			color: white;
			font-weight: bold;
			font-size: 18px;
			transition: 0.6s ease;
			border-radius: 0 3px 3px 0;
			user-select: none;
			background-color: rgba(0,0,0,0.8);
			z-index: 2;
		}

		.next {
			right: 0;
			border-radius: 3px 0 0 3px;
		}

		.prev:hover, .next:hover {
			background-color: rgba(0,0,0,0.5);
		}

		/* Hide gallery on desktop screens */
		@media screen and (min-width: 769px) {
			.gallery {
				display: none !important;
			}
		}

		/* Progress bar styles */
		.slideshow-progress {
			position: absolute;
			bottom: 20px;
			left: 50%;
			transform: translateX(-50%);
			display: flex;
			gap: 10px;
			z-index: 10;
		}

		.progress-dash {
			width: 30px;
			height: 4px;
			background-color: rgba(255, 255, 255, 0.3);
			border-radius: 2px;
			cursor: pointer;
			transition: background-color 0.3s ease;
		}

		.progress-dash.active {
			background-color: rgb(252, 0, 0);
		}

		.progress-dash:hover {
			background-color: rgba(252, 0, 0, 0.7);
		}

		.insta-float {
			position: fixed;
			bottom: 30px;
			right: 30px;
			background: #ffffff;
			color: #fff;
			border-radius: 50%;
			width: 76px;
			height: 76px;
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 2000;
			box-shadow: 0 2px 8px rgba(0,0,0,0.2);
			transition: background 0.2s;
			padding: 0;
			overflow: hidden;
		}
		.insta-float:hover { background: #000000; }
		.insta-float-logo {
			width: 66px;
			height: 66px;
			object-fit: contain;
			border-radius: 50%;
			display: block;
		}
		.insta-float:hover .insta-float-logo {
			filter: brightness(0) saturate(100%) invert(17%) sepia(99%) saturate(7492%) hue-rotate(357deg) brightness(99%) contrast(119%);
		}

		.dev-tag {
			position: fixed;
			bottom: 30px;
			left: 30px;
			background: rgba(0,0,0,0.7);
			color: #fff;
			padding: 8px 18px;
			border-radius: 18px;
			font-size: 15px;
			z-index: 2100;
			box-shadow: 0 2px 8px rgba(0,0,0,0.15);
			font-family: Arial, sans-serif;
		}
		.dev-tag a {
			color: #fc0000;
			text-decoration: underline;
			font-weight: bold;
		}

		@media (max-width: 768px) {
			.mobile-dev-tag {
				display: block;
				background: rgba(0,0,0,0.85);
				color: #fff;
				margin: 40px 0 0 0;
				padding: 14px 0 12px 0;
				text-align: center;
				font-size: 16px;
				font-family: Arial, sans-serif;
				width: 100%;
				border-radius: 0;
			}
			.mobile-dev-tag a {
				color: #fc0000;
				text-decoration: underline;
				font-weight: bold;
			}
			.dev-tag {
				position: static;
				bottom: auto;
				left: auto;
				margin: 40px 0 0 0;
				width: 100%;
				border-radius: 0;
				font-size: 12px;
				padding: 4px 10px;
				background: rgba(0,0,0,0.7);
				color: #fff;
				text-align: center;
			}
		}
		@media (min-width: 769px) {
			.mobile-dev-tag { display: none; }
		}
	</style>
</head>

		Follow on Instagram <a href="https://www.instagram.com/chowsifye" target="_blank"><span class="insta-username">@chowsifye</span></a>
	</div>

	<script>
	// Wait for the page to load completely
	document.addEventListener('DOMContentLoaded', function() {
		console.log('Page loaded, setting up menu functionality');
		
		// Get the elements
		const hamburger = document.querySelector('.hamburger');
		const sidenav = document.getElementById('sidenav');
		const overlay = document.querySelector('.menu-overlay');
		
		console.log('Hamburger button:', hamburger);
		console.log('Sidenav:', sidenav);
		console.log('Overlay:', overlay);
		
		// Add click event to hamburger button
		if (hamburger) {
			hamburger.addEventListener('click', function() {
				console.log('Hamburger clicked!');
				toggleMenu();
			});
		}
		
		// Add click event to overlay
		if (overlay) {
			overlay.addEventListener('click', function() {
				console.log('Overlay clicked!');
				closeMenu();
			});
		}
		
		// Add click event to close button
		const closeBtn = document.querySelector('.close-menu');
		if (closeBtn) {
			closeBtn.addEventListener('click', function() {
				console.log('Close button clicked!');
				closeMenu();
			});
		}
	});
	
	function toggleMenu() {
		console.log('toggleMenu function called');
		const sidenav = document.getElementById('sidenav');
		const overlay = document.querySelector('.menu-overlay');
		
		if (sidenav && overlay) {
			console.log('Toggling menu...');
			sidenav.classList.toggle('active');
			overlay.classList.toggle('active');
			console.log('Menu toggled. Sidenav classes:', sidenav.className);
			console.log('Menu toggled. Overlay classes:', overlay.className);
		} else {
			console.log('ERROR: Menu elements not found!');
		}
	}

	function closeMenu() {
		console.log('closeMenu function called');
		const sidenav = document.getElementById('sidenav');
		const overlay = document.querySelector('.menu-overlay');
		
		if (sidenav && overlay) {
			sidenav.classList.remove('active');
			overlay.classList.remove('active');
			console.log('Menu closed');
		}
	}

	// Close menu on escape key
	document.addEventListener('keydown', function(event) {
		if (event.key === 'Escape') {
			closeMenu();
		}
	});

	// Slideshow functionality
	let slideIndex = 1;
	let slideshowTimeout;

	function plusSlides(n) {
		console.log('Arrow clicked!', n);
		clearTimeout(slideshowTimeout);
		showSlides(slideIndex += n);
	}

	function showSlides(n) {
		let i;
		let slides = document.getElementsByClassName("slideshow-image");
		let links = document.getElementsByClassName("slideshow-link");
		let dashes = document.querySelectorAll('.progress-dash');

		if (n === undefined) { // For automatic cycling
			slideIndex++;
		}

		if (slideIndex > slides.length) {slideIndex = 1}
		if (slideIndex < 1) {slideIndex = slides.length}
		
		for (i = 0; i < slides.length; i++) {
			slides[i].style.opacity = "0"; // Hide all slides
			links[i].classList.remove('active'); // Remove active class from links
			dashes[i].classList.remove('active'); // Remove active class from dashes
		}
		slides[slideIndex-1].style.opacity = "1"; // Show current slide
		links[slideIndex-1].classList.add('active'); // Add active class to current link
		dashes[slideIndex-1].classList.add('active'); // Add active class to current dash

		// slideshowTimeout = setTimeout(showSlides, 4000); // Commented out to make manual
	}

	// Initialize slideshow on page load
	document.addEventListener('DOMContentLoaded', function() {
		showSlides(slideIndex);
		
		// Add click events to dashes
		const dashes = document.querySelectorAll('.progress-dash');
		dashes.forEach((dash, index) => {
			dash.addEventListener('click', function() {
				slideIndex = index + 1;
				showSlides();
			});
		});
	});
	</script>
</body>
</html>
